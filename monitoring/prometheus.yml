global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  # Docker Compose deployment (same Docker network, service name "api")
  - job_name: rul-api-compose
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Terraform-provisioned container (published on host port 8001)
  - job_name: rul-api-terraform
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8001"]

  # Kubernetes Service (NodePort 30080 on the host). The Service load-balances,
  # so each scrape hits one of the replicas.
  - job_name: rul-api-kubernetes
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:30080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
