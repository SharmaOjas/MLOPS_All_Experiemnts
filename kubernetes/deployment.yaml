apiVersion: apps/v1
kind: Deployment
metadata:
  name: rul-api
  namespace: rul-mlops
  labels:
    app: rul-api
spec:
  replicas: 3                     # scale to 5: kubectl scale deployment rul-api -n rul-mlops --replicas=5
  selector:
    matchLabels:
      app: rul-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: rul-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: rul-api
          image: rul-api:1.0.0      # built locally: docker build -f docker/Dockerfile -t rul-api:1.0.0 .
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
