# Central configuration for the Aircraft Engine RUL MLOps project.
# Paths are relative to the project root.

project:
  name: aircraft-rul-mlops
  version: 1.0.0

data:
  # Official NASA PCoE mirror of the C-MAPSS turbofan dataset
  download_url: "https://phm-datasets.s3.amazonaws.com/NASA/6.+Turbofan+Engine+Degradation+Simulation+Data+Set.zip"
  raw_dir: data/raw/CMAPSS
  processed_dir: data/processed
  subset: FD001            # FD002-FD004 load the same way; see docs/ASSUMPTIONS.md
  available_subsets: [FD001, FD002, FD003, FD004]

labels:
  # Piece-wise linear RUL target: early-life cycles are capped because
  # degradation is not observable yet (standard practice for C-MAPSS).
  rul_cap: 125

features:
  # Sensors whose training std is below this are dropped (constant in FD001)
  min_std: 0.0001
  rolling_window: 10
  feature_store_dir: feature_store

training:
  random_state: 42
  cv_folds: 5               # GroupKFold by engine unit -> no engine in both train and validation
  selection_metric: cv_rmse # model choice never looks at the official test set
  models:
    linear_regression: {}
    random_forest:
      n_estimators: 100
      max_depth: 12
      min_samples_leaf: 5
      n_jobs: -1
    gradient_boosting:
      n_estimators: 150
      max_depth: 3
      learning_rate: 0.1
      subsample: 0.5
    hist_gradient_boosting:
      max_iter: 300
      learning_rate: 0.05
      max_leaf_nodes: 31
      l2_regularization: 1.0

artifacts:
  model_dir: models
  model_file: rul_model.joblib

mlflow:
  tracking_uri: sqlite:///mlruns/mlflow.db
  artifact_dir: mlruns/artifacts
  experiment_name: aircraft-rul-fd001

serving:
  api_url: http://127.0.0.1:8000       # overridden by RUL_API_URL env var
  prometheus_url: http://127.0.0.1:9090 # overridden by PROMETHEUS_URL env var
  max_records: 1000
  drift_buffer_size: 500     # latest cycle of the last N prediction requests

github:
  repo: SharmaOjas/MLOPS_All_Experiemnts
